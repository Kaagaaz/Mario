<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pixel Run - Browser Platformer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--u:3px;--f:16px;--bw:3px;--navy:#1f2f66;--cream:#f7ecd5;--gold:#f9c846;--sky:#5c94fc;
  --s:max(calc(var(--u)*16),56px);--sa:max(calc(var(--u)*19),64px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--sky);touch-action:none;
  -webkit-user-select:none;user-select:none}
body,button{font-family:'Press Start 2P',monospace;-webkit-font-smoothing:none;font-smooth:never;
  text-rendering:optimizeSpeed;letter-spacing:0;color:#fff}
#game{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hidden{display:none!important}

/* ---------- HUD ---------- */
.hud{position:fixed;top:calc(var(--f)*1.25);font-size:var(--f);line-height:calc(var(--f)*1.5);
  text-shadow:calc(var(--f)/8) calc(var(--f)/8) 0 var(--navy);pointer-events:none;z-index:4}
#hudL{left:calc(var(--f)*1.25);display:flex;gap:calc(var(--f)*2.5)}
#hudR{right:calc(var(--f)*1.25);display:flex;gap:calc(var(--f)*2.5);align-items:flex-start;pointer-events:none}
#hearts{display:block;image-rendering:pixelated;margin-top:calc(var(--f)*.25)}
#pause{pointer-events:auto;width:calc(var(--f)*1.75);height:calc(var(--f)*2.5);background:var(--cream);color:var(--navy);
  border:var(--bw) solid var(--navy);box-shadow:var(--bw) var(--bw) 0 var(--navy);font-size:calc(var(--f)*.75);
  text-shadow:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#pause:active{transform:translate(var(--bw),var(--bw));box-shadow:none}
#hint{position:fixed;left:0;right:0;text-align:center;font-size:8px;line-height:8px;pointer-events:none;z-index:3;
  text-shadow:1px 1px 0 #1f6b2a;color:#fff;bottom:calc(var(--u)*27 - 4px)}

/* ---------- pixel buttons / panels ---------- */
.pbtn{font-size:var(--f);line-height:var(--f);padding:calc(var(--f)*.9) calc(var(--f)*1.2);border:var(--bw) solid var(--navy);
  cursor:pointer;background:var(--gold);color:var(--navy);box-shadow:var(--bw) var(--bw) 0 var(--navy);min-width:60%}
.pbtn.cream{background:var(--cream)}
.pbtn.small{font-size:8px;line-height:8px;padding:10px 14px;min-width:0}
.pbtn:active{transform:translate(var(--bw),var(--bw));box-shadow:none}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(31,47,102,.55);z-index:10;padding:16px}
.panel{width:min(94vw,600px);max-height:96vh;overflow:auto;background:var(--sky);padding:28px 20px;text-align:center;
  border:var(--bw) solid var(--navy);box-shadow:calc(var(--bw)*2) calc(var(--bw)*2) 0 var(--navy)}
.panel h1{font-size:24px;line-height:32px;color:#fff;text-shadow:3px 3px 0 var(--navy);margin-bottom:20px}
.panel h2{font-size:16px;line-height:24px;color:#fff;margin-bottom:20px;text-shadow:2px 2px 0 var(--navy)}
.panel p{font-size:8px;line-height:16px;margin:0 0 20px;color:#fff;text-shadow:1px 1px 0 var(--navy)}
.panel p.big{font-size:16px;line-height:24px;text-shadow:2px 2px 0 var(--navy)}
.stack{display:flex;flex-direction:column;gap:20px;align-items:center}
.row{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.key{min-width:44px;height:44px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;background:var(--cream);color:var(--navy);border:3px solid var(--navy);box-shadow:3px 3px 0 var(--navy)}
.or{font-size:8px;color:#fff;text-shadow:1px 1px 0 var(--navy)}
.dots{font-size:8px;color:#fff;margin-bottom:20px;text-shadow:1px 1px 0 var(--navy)}

/* ---------- on-screen controls (sit on the brick ground) ---------- */
#touch{position:fixed;left:0;right:0;bottom:0;height:0;z-index:5;pointer-events:none}
#touch button{position:absolute;pointer-events:auto;touch-action:none;border:var(--bw) solid var(--navy);
  box-shadow:var(--bw) var(--bw) 0 var(--navy);background:var(--cream);color:var(--navy);
  display:flex;align-items:center;justify-content:center;padding:0;width:var(--s);height:var(--s);
  bottom:calc(var(--u)*14 - var(--s)/2);font-size:calc(var(--f)*1.5)}
#touch button.on{transform:translate(var(--bw),var(--bw));box-shadow:none;filter:brightness(.95)}
#touch svg{width:calc(var(--u)*6);height:calc(var(--u)*7);fill:var(--navy);shape-rendering:crispEdges}
#bL{left:calc(var(--u)*4)}
#bR{left:calc(var(--u)*4 + var(--s) + var(--u)*3)}
#bA{right:calc(var(--u)*5);width:var(--sa)!important;height:var(--sa)!important;
  bottom:calc(var(--u)*14 - var(--sa)/2)!important;background:var(--gold)!important}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud" id="hudL">
  <div>PIXEL RUN<br><span id="wl">WORLD 1-1</span></div>
  <div>COINS<br><span id="co">00</span></div>
  <div>SCORE<br><span id="sc">000000</span></div>
</div>
<div class="hud" id="hudR">
  <div>LIVES<br><canvas id="hearts" width="30" height="7"></canvas></div>
  <button id="pause" aria-label="Pause">II</button>
</div>
<div id="hint"></div>

<!-- Choose play mode -->
<div id="modal" class="overlay">
  <div class="panel">
    <h1>PIXEL RUN</h1>
    <p class="big">HOW DO YOU WANT TO PLAY?</p>
    <div class="stack">
      <button class="pbtn" id="btnKb">KEYBOARD</button>
      <button class="pbtn cream" id="btnTouch">ON-SCREEN BUTTONS</button>
    </div>
  </div>
</div>

<!-- Keyboard tutorial -->
<div id="tutorial" class="overlay hidden">
  <div class="panel">
    <h2 id="tTitle"></h2>
    <div id="tBody"></div>
    <div class="dots" id="tDots"></div>
    <div class="stack">
      <button class="pbtn" id="tNext">NEXT</button>
      <button class="pbtn cream small" id="tSkip">SKIP</button>
    </div>
  </div>
</div>

<!-- Pause -->
<div id="pausemenu" class="overlay hidden">
  <div class="panel">
    <h1>PAUSED</h1>
    <div class="stack">
      <button class="pbtn" id="bResume">RESUME</button>
      <button class="pbtn cream" id="bFull">FULLSCREEN</button>
      <button class="pbtn cream" id="bMode">CHANGE MODE</button>
    </div>
  </div>
</div>

<!-- Game over -->
<div id="gameover" class="overlay hidden">
  <div class="panel">
    <h1>GAME OVER</h1>
    <p class="big">SCORE <span id="goS">0</span></p>
    <p class="big">BEST <span id="goB">0</span></p>
    <div class="stack"><button class="pbtn" id="btnAgain">PLAY AGAIN</button></div>
  </div>
</div>

<!-- On-screen controls -->
<div id="touch" class="hidden">
  <button id="bL" data-k="left" aria-label="Left"><svg viewBox="0 0 6 7"><polygon points="6,0 6,7 0,3.5"/></svg></button>
  <button id="bR" data-k="right" aria-label="Right"><svg viewBox="0 0 6 7"><polygon points="0,0 0,7 6,3.5"/></svg></button>
  <button id="bA" data-k="jump" aria-label="Jump">A</button>
</div>

<script>
(()=>{
'use strict';
/* ---------- constants ---------- */
const T=16, WH=176, GROUND_Y=144, LIVES=3;
const NAVY='#1f2f66';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=320,H=176,scale=4;
const $=id=>document.getElementById(id);
const hide=id=>$(id).classList.add('hidden'), show=id=>$(id).classList.remove('hidden');

/* ---------- pixel sprites (drawn from data, no emojis, no images) ---------- */
function mk(rows,pal,flip){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++){const row=rows[y].padEnd(w,'.');for(let x=0;x<w;x++){const ch=row[x];if(ch==='.')continue;
    g.fillStyle=pal[ch];g.fillRect(flip?w-1-x:x,y,1,1);}}
  return c;
}
/* hero (original design: green cap, orange jacket) - side view, facing right */
const HP={g:'#2fb36b',G:'#1f7f4b',h:'#7a4a2a',s:'#f6c493',e:NAVY,m:'#b5714a',o:'#f08a24',O:'#c25f12',y:'#ffd23f',t:'#7a3f22',b:'#4b2a3a'};
const head=[
".....gggggg.....",
"....gggggggg....",
"...gggggggggg...",
"...ggggggggGGGG.",
"...hhssssssss...",
"...hhssssssses..",
"...hhssssssssss.",
"....ssssssssmm..",
".....ssssssss..."];
const body=[
"....oooooooo....",
"...oooooooooo...",
"...ooyooooooosss",
"...oooooooooss..",
"...OOOOOOOOOO...",
"....OOOOOOOO...."];
const legs={
idle:["....tttt.tttt...","....tttt.tttt...","....tttt.tttt...","....tttt.tttt...","....bbbb.bbbbb..","...bbbbb.bbbbbb."],
run1:["....tttt.tttt...","....tttt..tttt..","...tttt....tttt.","..tttt......ttt.","..bbbbb.....bbbb","..bbbbb.....bbbb"],
run2:["....tttttttt....","....tttttttt....","....tttttttt....","....tttttttt....","....bbbbbbbb....","...bbbbbbbbb...."],
jump:["....ttt..tttt...","...ttt....tttt..","..ttt......ttt..","..bbbb.....bbbb.","..bbbb.....bbbb.","................"]};
const heroR={},heroL={};
for(const k in legs){const rows=head.concat(body,legs[k]);heroR[k]=mk(rows,HP,false);heroL[k]=mk(rows,HP,true);}

/* enemy: purple blob */
const EP={p:'#b04a9e',l:'#d77bc7',w:'#ffffff',n:NAVY,f:'#5b2a63'};
const blobBody=["......pppp......","....pppppppp....","...pppppppppp...","..pppppppppppp..","..ppwwpppwwppp..","..ppwnpppnwppp..","..pppppppppppp..",".pppppppppppppp.","pppppppppppppppp",".pppppppppppppp."];
const blob=[mk(blobBody.concat(["...fff....fff...","..ffff....ffff.."]),EP),mk(blobBody.concat(["....fff..fff....","...ffff..ffff..."]),EP)];

/* coin: tall gold coin with cream shine */
const coinSpr=mk(["..cccc..","gggggggg","ggyyyygg","ggyooygg","ggyooygg","ggyooygg","ggyyyygg","ggyyyygg","gggggggg"],
  {c:'#ffe9a0',g:'#ffc02a',y:'#ffe96a',o:'#e8902a'});

function tileCanvas(draw){const c=document.createElement('canvas');c.width=c.height=T;draw(c.getContext('2d'));return c;}
const DIRT='#c4843f',SEAM='#a56a30',GRASS='#6cc84a',GRASSD='#3a8f38';
function dirt(g){g.fillStyle=DIRT;g.fillRect(0,0,16,16);g.fillStyle=SEAM;g.fillRect(0,0,1,16);}
const TILE={
g:tileCanvas(g=>{dirt(g);g.fillStyle=GRASS;g.fillRect(0,0,16,4);g.fillStyle=GRASSD;g.fillRect(0,4,16,3);
  g.fillStyle=SEAM;g.fillRect(0,7,1,9);g.fillStyle='#b27434';g.fillRect(9,11,3,2);}),
d:tileCanvas(g=>{dirt(g);g.fillStyle='#b27434';g.fillRect(8,6,3,2);g.fillRect(3,12,2,2);}),
/* golden platform (cream top, studs, dark underside) */
b:tileCanvas(g=>{g.fillStyle='#ffe29b';g.fillRect(0,0,16,4);g.fillStyle='#f5b958';g.fillRect(0,4,16,10);
  g.fillStyle='#c27a2c';g.fillRect(3,6,2,2);g.fillRect(11,6,2,2);
  g.fillStyle='#a65f2a';g.fillRect(0,10,16,3);g.fillStyle='#e08a2e';g.fillRect(0,13,16,3);}),
/* purple "!" block */
q:tileCanvas(g=>{g.fillStyle='#8f55e8';g.fillRect(0,0,16,16);g.fillStyle='#c79bff';g.fillRect(2,2,12,12);
  g.fillStyle='#fff';g.fillRect(7,4,2,6);g.fillRect(7,11,2,2);}),
u:tileCanvas(g=>{g.fillStyle='#6f6a99';g.fillRect(0,0,16,16);g.fillStyle='#a9a4cc';g.fillRect(2,2,12,12);}),
/* solid brick block */
s:tileCanvas(g=>{g.fillStyle=SEAM;g.fillRect(0,0,16,16);g.fillStyle=DIRT;g.fillRect(1,1,14,14);
  g.fillStyle='#b27434';g.fillRect(3,3,3,2);g.fillRect(10,10,3,2);g.fillStyle='#dba062';g.fillRect(1,1,14,1);})
};
const EDGE='#e08a2e';

/* ---------- state ---------- */
const tiles=new Map(); const key=(x,y)=>x*16+y;
let enemies=[],coins=[],fx=[];
let camX=0,genX=0,flat=0,tick=0,bonus=0,coinCount=0,state='menu',mode=null,best=0,overT=0,lives=LIVES;
try{best=+localStorage.getItem('pixelrun_best')||0}catch(e){}
const P={x:0,y:0,vx:0,vy:0,w:10,h:21,dir:1,ground:false,coyote:0,buf:0,latch:false,anim:0,dead:false,deadT:0,maxX:0,inv:0};
const keys={left:false,right:false,jump:false}, touch={left:false,right:false,jump:false};

const diff=()=>Math.min(1,P.maxX/9000);
const solidAt=(tx,ty)=>tx>=0&&ty>=0&&tiles.has(key(tx,ty));
const put=(tx,ty,t)=>tiles.set(key(tx,ty),t);
const putGround=tx=>{put(tx,9,'g');put(tx,10,'d');};

/* ---------- level generation (endless) ---------- */
function genSeg(){
  const d=diff();
  if(genX<16){for(;genX<16;genX++)putGround(genX);flat=16;return;}
  if(flat>=5&&Math.random()<0.3){
    let w=2+Math.floor(d*2.2)+((d>0.4&&Math.random()<0.4)?1:0); w=Math.min(4,w);
    for(let i=0;i<3;i++){const cx=(genX+(w*(i+1))/4)*T;const cy=GROUND_Y-52-Math.sin((i/2)*Math.PI)*18;
      coins.push({x:cx-4,y:cy,got:false});}
    genX+=w;flat=0;return;
  }
  const len=4+Math.floor(Math.random()*5),s=genX;
  for(let i=0;i<len;i++)putGround(s+i);
  const r=Math.random();let pillar=false;
  if(len>=5&&r<0.22){
    pillar=true;const h=(d<0.35||Math.random()<0.5)?2:3;
    for(let k=0;k<h;k++){put(s+2,8-k,'s');put(s+3,8-k,'s');}
  }else if(r<0.6){
    const row=5+(Math.random()<0.5?1:0),n=Math.min(len-1,3+Math.floor(Math.random()*3));
    for(let i=0;i<n;i++)put(s+1+i,row,(i%2===1&&Math.random()<0.75)?'q':'b');
  }else if(r<0.78){
    const n=3+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++)coins.push({x:(s+1+i)*T+4,y:GROUND_Y-30,got:false});
  }
  if(len>=5&&Math.random()<0.25+0.55*d){
    spawnEnemy((s+len-2)*T);
    if(!pillar&&d>0.5&&Math.random()<0.5)spawnEnemy((s+1)*T);
  }
  genX+=len;flat+=len;
}
function spawnEnemy(x){enemies.push({x,y:GROUND_Y-12,w:14,h:12,vx:0,vy:0,dir:-1,alive:true,squash:0,ground:false});}

/* ---------- collision ---------- */
function collideX(e){
  const top=Math.floor(e.y/T),bot=Math.floor((e.y+e.h-0.01)/T);
  if(e.vx>0){const tx=Math.floor((e.x+e.w)/T);
    for(let ty=top;ty<=bot;ty++)if(solidAt(tx,ty)){e.x=tx*T-e.w-0.001;e.vx=0;return true;}}
  else if(e.vx<0){const tx=Math.floor(e.x/T);
    for(let ty=top;ty<=bot;ty++)if(solidAt(tx,ty)){e.x=(tx+1)*T;e.vx=0;return true;}}
  return false;
}
function collideY(e,isP){
  const l=Math.floor(e.x/T),r=Math.floor((e.x+e.w-0.01)/T);
  e.ground=false;
  if(e.vy>=0){const ty=Math.floor((e.y+e.h)/T);
    for(let tx=l;tx<=r;tx++)if(solidAt(tx,ty)){e.y=ty*T-e.h;e.vy=0;e.ground=true;return;}}
  else{const ty=Math.floor(e.y/T);let hit=-1;const mid=Math.floor((e.x+e.w/2)/T);
    if(solidAt(mid,ty))hit=mid;else for(let tx=l;tx<=r;tx++)if(solidAt(tx,ty)){hit=tx;break;}
    if(hit>=0){e.y=(ty+1)*T;e.vy=0;if(isP)hitBlock(hit,ty);}}
}
function hitBlock(tx,ty){
  const k=key(tx,ty),t=tiles.get(k);
  if(t==='q'){tiles.set(k,'u');coinCount++;bonus+=10;fx.push({x:tx*T+4,y:ty*T-10,vy:-3,t:0});beep(988,.08,'square',.05);beep(1319,.18,'square',.05);}
  else beep(110,.06,'square',.05);
}

/* ---------- audio ---------- */
let ac=null;
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function beep(f,d,type,vol,slide){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+d);
  g.gain.setValueAtTime(vol||.04,t);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);}catch(e){}}

/* ---------- hearts HUD ---------- */
const HEART=[".##.##.","#######","#######",".#####.","..###..","...#..."];
function drawHearts(){
  const c=$('hearts'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  for(let i=0;i<LIVES;i++){
    const ox=i*10,on=i<lives;
    for(let y=0;y<6;y++)for(let x=0;x<7;x++){if(HEART[y][x]!=='#')continue;
      g.fillStyle=NAVY;g.globalAlpha=on?1:.35;g.fillRect(ox+x+1,y+1,1,1);
      g.globalAlpha=1;g.fillStyle=on?'#ffffff':'rgba(255,255,255,.25)';g.fillRect(ox+x,y,1,1);}
  }
}

/* ---------- game flow ---------- */
function reset(){
  tiles.clear();enemies=[];coins=[];fx=[];genX=0;flat=0;camX=0;tick=0;bonus=0;coinCount=0;lives=LIVES;
  Object.assign(P,{x:40,y:GROUND_Y-21,vx:0,vy:0,dir:1,ground:true,coyote:0,buf:0,latch:false,anim:0,dead:false,deadT:0,maxX:40,inv:0});
  while(genX*T<camX+W+160)genSeg();
  drawHearts();
}
function startGame(){reset();state='play';hide('modal');hide('tutorial');hide('gameover');hide('pausemenu');}
function die(){if(P.dead)return;P.dead=true;P.vy=-6;P.vx=0;P.deadT=0;lives--;drawHearts();beep(400,.5,'square',.06,-300);}
function respawn(){
  let tx=Math.ceil(Math.max(P.x,camX+16)/T);
  while(!(solidAt(tx,9)&&solidAt(tx+1,9)&&!solidAt(tx,8)&&!solidAt(tx+1,8)))tx++;
  Object.assign(P,{x:tx*T+3,y:GROUND_Y-21,vx:0,vy:0,dead:false,deadT:0,ground:true,inv:120,latch:true,buf:0});
  enemies=enemies.filter(e=>Math.abs(e.x-P.x)>96);
}
function endGame(){
  state='over';overT=0;const sc=score();
  if(sc>best){best=sc;try{localStorage.setItem('pixelrun_best',best)}catch(e){}}
  $('goS').textContent=sc;$('goB').textContent=best;show('gameover');
}
const score=()=>Math.floor(P.maxX/T)+bonus;
function setPause(on){
  if(on&&state==='play'){state='pause';keys.left=keys.right=keys.jump=false;touch.left=touch.right=touch.jump=false;show('pausemenu');}
  else if(!on&&state==='pause'){state='play';hide('pausemenu');}
}

function update(){
  tick++;
  if(P.dead){P.vy+=0.4;P.y+=P.vy;P.deadT++;
    if(P.y>WH+60&&P.deadT>50){if(lives>0)respawn();else endGame();}return;}
  if(P.inv>0)P.inv--;
  const left=keys.left||touch.left,right=keys.right||touch.right,jump=keys.jump||touch.jump;
  const maxRun=1.1+Math.min(2.4,P.maxX/3600);
  const acc=P.ground?0.1:0.07;
  if(right&&!left){if(P.vx<0)P.vx+=0.2;P.vx=Math.min(maxRun,P.vx+acc);P.dir=1;}
  else if(left&&!right){if(P.vx>0)P.vx-=0.2;P.vx=Math.max(-maxRun*0.8,P.vx-acc);P.dir=-1;}
  else{const f=P.ground?0.12:0.02;P.vx=Math.abs(P.vx)<=f?0:P.vx-Math.sign(P.vx)*f;}

  if(P.ground)P.coyote=6;else if(P.coyote>0)P.coyote--;
  if(jump&&!P.latch)P.buf=6;P.latch=jump;if(P.buf>0)P.buf--;
  if(P.buf>0&&P.coyote>0){P.vy=-5.3-Math.abs(P.vx)*0.15;P.coyote=0;P.buf=0;P.ground=false;beep(520,.15,'square',.05,300);}
  P.vy=Math.min(P.vy+((P.vy<0&&jump)?0.2:0.5),8);

  P.x+=P.vx;if(P.x<camX){P.x=camX;if(P.vx<0)P.vx=0;}collideX(P);
  P.y+=P.vy;collideY(P,true);
  if(P.y>WH+10){die();return;}
  P.maxX=Math.max(P.maxX,P.x);
  camX=Math.max(camX,P.x-W*0.35);
  while(genX*T<camX+W+160)genSeg();

  /* legs only move while actually running on the ground */
  if(P.ground&&Math.abs(P.vx)>0.15)P.anim+=Math.abs(P.vx)*0.12;else if(P.ground)P.anim=0;

  const d=diff();
  for(const e of enemies){
    if(!e.alive){e.squash--;continue;}
    e.vx=e.dir*(0.35+0.4*d);e.x+=e.vx;
    if(collideX(e))e.dir*=-1;
    if(e.ground){const ahead=Math.floor((e.x+(e.dir>0?e.w+1:-1))/T);
      if(!solidAt(ahead,Math.floor((e.y+e.h+1)/T)))e.dir*=-1;}
    e.vy=Math.min(e.vy+0.4,6);e.y+=e.vy;collideY(e,false);
    if(P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y){
      if(P.vy>0.5&&P.y+P.h-e.y<11){e.alive=false;e.squash=25;P.vy=jump?-6.5:-4;bonus+=20;beep(300,.12,'square',.05,200);}
      else if(P.inv<=0){die();return;}
    }
  }
  for(const c of coins){if(!c.got&&P.x<c.x+8&&P.x+P.w>c.x&&P.y<c.y+9&&P.y+P.h>c.y){
    c.got=true;coinCount++;bonus+=10;beep(988,.07,'square',.05);beep(1319,.15,'square',.05);}}
  for(const f of fx){f.y+=f.vy;f.vy+=0.25;f.t++;}
  if(tick%60===0){
    for(const k of tiles.keys())if((k>>4)*T<camX-64)tiles.delete(k);
    enemies=enemies.filter(e=>e.x>camX-80&&e.y<WH+60&&(e.alive||e.squash>0));
    coins=coins.filter(c=>!c.got&&c.x>camX-40);
  }
  fx=fx.filter(f=>f.t<30);
}

/* ---------- rendering ---------- */
function resize(){
  const iw=window.innerWidth,ih=window.innerHeight;
  scale=Math.max(1,Math.round(ih/WH));
  W=Math.ceil(iw/scale);H=Math.ceil(ih/scale);
  canvas.width=W;canvas.height=H;
  canvas.style.width=(W*scale)+'px';canvas.style.height=(H*scale)+'px';
  canvas.style.left='0px';canvas.style.top=(ih-H*scale)+'px';
  ctx.imageSmoothingEnabled=false;
  const f=8*Math.max(1,Math.round(scale/2));
  const r=document.documentElement.style;
  r.setProperty('--u',scale+'px');r.setProperty('--f',f+'px');r.setProperty('--bw',Math.max(2,scale)+'px');
  const k=Math.max(2,Math.round(scale*0.9));
  $('hearts').style.width=(30*k)+'px';$('hearts').style.height=(7*k)+'px';
}
function cloud(x,y){
  ctx.fillStyle='#ffffff';ctx.fillRect(x+4,y,20,4);ctx.fillRect(x,y+4,32,8);
}
function bush(x,w,h){
  const base=GROUND_Y,t1=Math.round(h*.4),t2=Math.round(h*.72);
  ctx.fillStyle='#68c56c';
  ctx.fillRect(x,base-t1,w,t1);
  ctx.fillRect(x+Math.round(w*.1),base-t2,Math.round(w*.8),t2-t1);
  ctx.fillRect(x+Math.round(w*.26),base-h,Math.round(w*.48),h-t2);
  ctx.fillStyle='#9ae577';
  ctx.fillRect(x+Math.round(w*.18),base-Math.round(h*.62),8,4);
  ctx.fillRect(x+Math.round(w*.38),base-Math.round(h*.36),8,6);
  ctx.fillRect(x+Math.round(w*.66),base-Math.round(h*.38),8,2);ctx.fillRect(x+Math.round(w*.66)+6,base-Math.round(h*.38),2,6);
}
function draw(){
  ctx.fillStyle='#5c94fc';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(0,H-WH);
  const cx=Math.floor(camX);
  for(let k=-1;k<=Math.ceil(W/300)+1;k++){const ox=k*300-Math.floor((camX*0.15)%300);
    cloud(ox+30,34);cloud(ox+150,56);cloud(ox+230,12);cloud(ox+90,-14);}
  for(let k=-1;k<=Math.ceil(W/340)+1;k++){const ox=k*340-Math.floor((camX*0.3)%340);
    bush(ox+16,112,46);bush(ox+190,88,36);}
  const t0=Math.floor(cx/T),t1=Math.floor((cx+W)/T)+1;
  for(let tx=t0;tx<=t1;tx++)for(let ty=0;ty<11;ty++){const t=tiles.get(key(tx,ty));
    if(!t)continue;const px=tx*T-cx,py=ty*T;
    ctx.drawImage(TILE[t],px,py);
    if(t==='b'||t==='q'||t==='u'){ /* platform end-caps */
      const L=tiles.get(key(tx-1,ty)),R=tiles.get(key(tx+1,ty));
      if(t==='b'){ctx.fillStyle=EDGE;
        if(!L)ctx.fillRect(px,py+4,2,12);
        if(!R)ctx.fillRect(px+14,py+4,2,12);}
    }
  }
  /* bottom navy bar (like the original) */
  ctx.fillStyle=NAVY;ctx.fillRect(0,WH-3,W,3+ (H-WH>0?0:0));
  const cf=Math.floor(tick/8)%4,cw=[8,4,2,4][cf];
  for(const c of coins)if(!c.got)ctx.drawImage(coinSpr,0,0,8,9,Math.round(c.x-cx+(8-cw)/2),Math.round(c.y),cw,9);
  for(const f of fx)ctx.drawImage(coinSpr,Math.round(f.x-cx),Math.round(f.y));
  const ef=Math.floor(tick/12)%2;
  ctx.fillStyle='rgba(31,47,102,.3)';
  for(const e of enemies){
    if(e.alive){ctx.fillRect(Math.round(e.x-cx),Math.round(e.y+e.h-1),e.w,2);ctx.drawImage(blob[ef],Math.round(e.x-1-cx),Math.round(e.y));}
    else ctx.drawImage(blob[0],0,0,16,12,Math.round(e.x-1-cx),Math.round(e.y+6),16,6);
  }
  let frame='idle';
  if(!P.ground||P.dead)frame='jump';
  else if(Math.abs(P.vx)>0.15)frame=(Math.floor(P.anim)%2)?'run2':'run1';
  const spr=(P.dir>0?heroR:heroL)[frame];
  if(!(P.inv>0&&Math.floor(tick/4)%2===0)){
    if(!P.dead){ctx.fillStyle='rgba(31,47,102,.3)';ctx.fillRect(Math.round(P.x-cx),Math.round(P.y+P.h-1),P.w,2);}
    ctx.drawImage(spr,Math.round(P.x-3-cx),Math.round(P.y));
  }
  ctx.restore();
  /* HUD text */
  const s=String(score()).padStart(6,'0');if($('sc').textContent!==s)$('sc').textContent=s;
  const c=String(coinCount).padStart(2,'0');if($('co').textContent!==c)$('co').textContent=c;
  const stage=1+Math.floor(P.maxX/2400),wl='WORLD '+(1+Math.floor((stage-1)/4))+'-'+(((stage-1)%4)+1);
  if($('wl').textContent!==wl)$('wl').textContent=wl;
}
let last=performance.now(),accT=0;
function loop(t){
  accT+=Math.min(100,t-last);last=t;
  while(accT>=1000/60){if(state==='play')update();else if(state==='over')overT++;accT-=1000/60;}
  draw();requestAnimationFrame(loop);
}

/* ---------- input ---------- */
const MAP={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',
  ArrowUp:'jump',w:'jump',W:'jump',' ':'jump'};
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){if(state==='play')setPause(true);else if(state==='pause')setPause(false);return;}
  const k=MAP[e.key];
  if(state==='over'&&overT>30&&(e.key==='Enter'||e.key===' ')){e.preventDefault();startGame();return;}
  if(k&&state==='play'){e.preventDefault();keys[k]=true;}
});
window.addEventListener('keyup',e=>{const k=MAP[e.key];if(k){if(state==='play')e.preventDefault();keys[k]=false;}});
window.addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false;touch.left=touch.right=touch.jump=false;if(state==='play')setPause(true);});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();initAudio();try{b.releasePointerCapture(e.pointerId)}catch(_){}touch[k]=true;b.classList.add('on');};
  const off=()=>{touch[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);
  b.addEventListener('pointerenter',e=>{if(e.buttons>0||e.pointerType==='touch')on(e);});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off));
});

/* ---------- menus ---------- */
const STEPS=[
 {t:'MOVE',h:'<div class="row"><span class="key">A</span><span class="key">D</span><span class="or">OR</span><span class="key">&lt;</span><span class="key">&gt;</span></div><p>RUN LEFT AND RIGHT. YOU START SLOW BUT THE LONGER YOU RUN, THE FASTER YOU GO!</p>'},
 {t:'JUMP',h:'<div class="row"><span class="key">SPACE</span><span class="or">OR</span><span class="key">W</span><span class="key">^</span></div><p>HOLD THE KEY LONGER TO JUMP HIGHER. TAP IT FOR A SMALL HOP.</p>'},
 {t:'SURVIVE',h:'<p>JUMP ON PURPLE BLOBS TO SQUASH THEM.<br><br>HIT THE ! BLOCKS FROM BELOW FOR COINS.<br><br>DO NOT FALL IN GAPS OR TOUCH BLOBS FROM THE SIDE. YOU HAVE 3 LIVES.<br><br>PRESS P TO PAUSE. THE GAME NEVER ENDS!</p>'}];
let step=0;
function renderTut(){
  $('tTitle').textContent=STEPS[step].t;$('tBody').innerHTML=STEPS[step].h;
  $('tDots').textContent=STEPS.map((_,i)=>i===step?'[*]':'[ ]').join(' ');
  $('tNext').textContent=step===STEPS.length-1?'START':'NEXT';
}
function setMode(m){mode=m;
  $('hint').textContent=m==='kb'?'A / D OR ARROWS TO MOVE - SPACE TO JUMP - P TO PAUSE':'HOLD < / > TO MOVE - TAP A TO JUMP';
  if(m==='kb')hide('touch');else show('touch');}
$('btnKb').onclick=e=>{e.target.blur();initAudio();setMode('kb');hide('modal');step=0;renderTut();show('tutorial');};
$('btnTouch').onclick=e=>{e.target.blur();initAudio();setMode('touch');startGame();};
$('tNext').onclick=e=>{e.target.blur();if(step<STEPS.length-1){step++;renderTut();}else startGame();};
$('tSkip').onclick=e=>{e.target.blur();startGame();};
$('btnAgain').onclick=e=>{e.target.blur();startGame();};
$('pause').onclick=e=>{e.target.blur();if(state==='play')setPause(true);else if(state==='pause')setPause(false);};
$('bResume').onclick=e=>{e.target.blur();setPause(false);};
$('bFull').onclick=e=>{e.target.blur();
  try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(_){}};
$('bMode').onclick=e=>{e.target.blur();state='menu';hide('touch');hide('tutorial');hide('gameover');hide('pausemenu');show('modal');reset();};

window.addEventListener('resize',resize);
resize();reset();$('hint').textContent='';requestAnimationFrame(loop);
})();
</script>
